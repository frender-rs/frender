[package]
name = "frender"
version = "2.0.0-alpha.1"
authors = ["EqualMa <equalma@outlook.com>"]
edition = "2021"
description = "react in rust. functional rendering web ui"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.63"
js-sys = "0.3"
frender-common = { version = "0.1.0", path = "../frender-common" }
frender-ssr = { version = "0.1.0", path = "../frender-ssr", default-features = false }
pin-project-lite = "0.2.9"
lazy-pinned = "0.1.0"
either = { version = "1.8.1", default-features = false, optional = true }
frender-events = { version = "0.1.0", path = "../frender-events" }
async-str-iter = { version = "0.1.0", path = "../async-str-iter" }
frender-csr-web = { version = "0.1.0", path = "../frender-csr-web", optional = true }
frender-render-with = { version = "0.1.0", path = "../frender-render-with", optional = true }
frender-keyed-elements = { version = "0.1.0", path = "../frender-keyed-elements", optional = true }
frender-context = { version = "0.1.0", path = "../frender-context", default-features = false, optional = true }
frender-element = { version = "0.1.0", path = "../frender-element", default-features = false }
frender-style = { version = "0.1.0", path = "../frender-style" }
frender-dom-tokens = { version = "0.1.0", path = "../frender-dom-tokens" }
frender-reactive-value = { version = "0.1.0", path = "../frender-reactive-value" }
frender-to-element = { version = "0.1.0", path = "../frender-to-element", optional = true }
frender-memo = { version = "0.1.0", path = "../frender-memo", optional = true }
frender-hooks-ext = { version = "0.1.0", path = "../frender-hooks-ext", optional = true }
frender-synced-collection = { version = "0.1.0", path = "../frender-synced-collection", optional = true }

[dependencies.frender-hook-element]
path = "../frender-hook-element"
version = "0.1.0"

[dependencies.frender-html]
path = "../frender-html"
version = "0.1.0"
default-features = false
features = ["experimental"]

[dependencies.frender-macros]
version = "1.0.0-alpha.8"
path = "../frender-macros"

[dev-dependencies]
futures-lite = "2.0.1"
wasm-bindgen-test = "0.3.13"

[features]
default = [
    #
    "default-",
    "web",
    "csr",
    "ssr",
]
"default-" = [
    "html-components",
    "either",
    "hooks",
    "ToElement",
    "context",
    "SyncedCollection",
    "KeyedElements",
    "Memo",
]
feature_impl_trait_in_assoc_type = [
    "frender-render-with?/feature_impl_trait_in_assoc_type",
]
html = ["csr"] # TODO: remove
html-components = ["html", "frender-html/components"]
either = [
    #
    "dep:either",
    "frender-ssr/either",
    "frender-html/either",
    "frender-hooks-ext?/either",
]
web = ["dep:frender-csr-web"]
spawn = ["frender-csr-web?/spawn"]
ssr = [
    #
    "frender-keyed-elements?/ssr",
    "frender-html/ssr",
    "frender-element/ssr",
    "frender-memo?/ssr",
    "frender-hooks-ext?/ssr",
    "frender-synced-collection?/ssr",
]
csr = [
    #
    "frender-keyed-elements?/csr",
    "frender-render-with?/csr",
    "frender-csr-web?/csr",
    "frender-html/csr",
    "frender-element/csr",
    "frender-memo?/csr",
    "frender-memo?/experimental",
    "frender-hooks-ext?/csr",
    "frender-synced-collection?/csr",
]
RenderWith = ["dep:frender-render-with"]
KeyedElements = ["dep:frender-keyed-elements"]
ToElement = [
    "dep:frender-to-element",
    "frender-hooks-ext?/ToElement",
    "frender-synced-collection?/ToElement",
]
context = ["dep:frender-context"]
hooks = ["frender-context?/hooks", "hooks_ext"]
hooks_ext = ["dep:frender-hooks-ext"]
SyncedCollection = ["dep:frender-synced-collection"]
Memo = ["dep:frender-memo"]
