[package]
name = "frender-element"
version = "0.1.0"
edition = "2021"

[dependencies]
frender-csr = { version = "0.1.0", path = "../frender-csr", optional = true }
frender-ssr = { version = "0.1.0", path = "../frender-ssr", optional = true }

[features]
default = ["csr", "ssr"]
csr = ["dep:frender-csr"]
ssr = ["dep:frender-ssr"]
either = ["frender-ssr?/either", "frender-csr?/either"]
