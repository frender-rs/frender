[package]
name = "frender-attrs"
version = "0.1.0"
edition = "2021"

[dependencies]
frender-common = { version = "0.1.0", path = "../frender-common" }
either = { version = "1.15.0", optional = true, default-features = false }
frender-macro-rules = { version = "0.1.0", path = "../frender-macro-rules", features = [
    "define_phantom_wrapper",
] }
chtml = { version = "0.1.0", path = "../chtml" }

[features]
default = ["csr", "ssr", "either"] # TODO: remove
csr = []
ssr = []
either = ["dep:either"]
