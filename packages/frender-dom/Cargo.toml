[package]
name = "frender-dom"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pin-project-lite = "0.2.9"
frender-html-common = { version = "0.1.0", path = "../frender-html-common" }
frender-events = { version = "0.1.0", path = "../frender-events" }
frender-common = { version = "0.1.0", path = "../frender-common" }
# stack_dst = "0.8.1"
gloo-events = { version = "0.2.0", optional = true }
frender-ssr = { version = "0.1.0", path = "../frender-ssr" }
wasm-bindgen = { version = "0.2.83", optional = true }
async-str-iter = { version = "0.1.0", path = "../async-str-iter" }
either = { version = "1.9.0", default-features = false, optional = true }
frender-csr = { version = "0.1.0", path = "../frender-csr" }

[dependencies.web-sys]
version = "0.3.60"
optional = true
features = [
    #
    "console",
    "DomTokenList",
    "Event",
    "EventTarget",
    "Document",
    "Node",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
]

[features]
web = [
    "dep:web-sys",
    "dep:wasm-bindgen",
    "frender-events/web",
    "dep:gloo-events",
    "frender-html-common/web",
]
either = [
    "dep:either",
    "frender-html-common/either",
    "frender-ssr/either",
    "frender-csr/either",
]
