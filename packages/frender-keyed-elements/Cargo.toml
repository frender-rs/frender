[package]
name = "frender-keyed-elements"
version = "0.1.0"
edition = "2021"

[dependencies]
async-str-iter = { version = "0.1.0", path = "../async-str-iter", default-features = false, optional = true }
frender-csr = { version = "0.1.0", path = "../frender-csr", optional = true, features = [
    "experimental",
] }
frender-ssr = { version = "0.1.0", path = "../frender-ssr", default-features = false, optional = true }
indexmap = { version = "2.2.6", optional = true }

[dev-dependencies]
frender-test = { version = "0.1.0", path = "../frender-test" }
frender-html-components = { version = "0.1.0", path = "../frender-html-components" }

[features]
ssr = ["dep:async-str-iter", "dep:frender-ssr"]
csr = ["dep:frender-csr", "dep:indexmap"]
