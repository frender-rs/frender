[package]
name = "frender-form-control"
version = "0.1.0"
edition = "2021"

[dependencies]
async-str-iter = { version = "0.1.0", path = "../async-str-iter", default-features = false }
chrono = { version = "0.4.39", default-features = false, optional = true }
either = { version = "1.13.0", optional = true }
frender-attr-value = { version = "0.1.0", path = "../frender-attr-value" }
frender-common = { version = "0.1.0", path = "../frender-common" }
frender-dom = { version = "0.1.0", path = "../frender-dom" }
frender-events = { version = "0.1.0", path = "../frender-events" }
frender-macro-rules = { version = "0.1.0", path = "../frender-macro-rules" }
frender-reactive-value = { version = "0.1.0", path = "../frender-reactive-value" }
frender-ssr = { version = "0.1.0", path = "../frender-ssr", optional = true }

[dependencies.web-sys]
version = "0.3.60"
optional = true
features = [
    #
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "HtmlTextAreaElement",
]

[features]
csr = ["frender-dom/csr"]
ssr = ["dep:frender-ssr", "frender-dom/ssr", "frender-reactive-value/ssr"]
web = ["frender-events/web", "frender-dom/web", "dep:web-sys"]
chrono = ["dep:chrono"]
either = ["dep:either"]
