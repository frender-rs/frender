[package]
name = "frender-html"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = { version = "0.2.83", optional = true }
pin-project-lite = "0.2.9"
frender-events = { version = "0.1.0", path = "../frender-events" }
frender-common = { version = "0.1.0", path = "../frender-common" }
# stack_dst = "0.8.1"
gloo-events = { version = "0.2.0", optional = true }
js-sys = { version = "0.3.64", optional = true }
frender-ssr = { version = "0.1.0", path = "../frender-ssr", optional = true }
frender-dom = { version = "0.1.0", path = "../frender-dom" }
async-str-iter = { version = "0.1.0", path = "../async-str-iter" }
either = { version = "1.9.0", default-features = false, optional = true }
frender-style = { version = "0.1.0", path = "../frender-style" }
frender-attr-value = { version = "0.1.0", path = "../frender-attr-value", features = [
    "html",
] }
frender-form-control = { version = "0.1.0", path = "../frender-form-control", features = [
    "ssr",
] }
arrayvec = { version = "0.7.6", default-features = false }
ref-cast = { version = "1.0.23", optional = true }

[dependencies.web-sys]
version = "0.3.60"
optional = true
features = [
    #
    "DataTransfer",
    "Element",
    "HtmlAnchorElement",
    "HtmlAreaElement",
    "HtmlAudioElement",
    "HtmlBaseElement",
    "HtmlBodyElement",
    "HtmlBrElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlDListElement",
    "HtmlDataElement",
    "HtmlDataListElement",
    "HtmlDetailsElement",
    "HtmlDialogElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlEmbedElement",
    "HtmlFieldSetElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlHeadingElement",
    "HtmlHrElement",
    "HtmlHtmlElement",
    "HtmlIFrameElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlLabelElement",
    "HtmlLegendElement",
    "HtmlLiElement",
    "HtmlLinkElement",
    "HtmlMapElement",
    "HtmlMenuElement",
    "HtmlMetaElement",
    "HtmlMeterElement",
    "HtmlModElement",
    "HtmlOListElement",
    "HtmlObjectElement",
    "HtmlOptGroupElement",
    "HtmlOptionElement",
    "HtmlOutputElement",
    "HtmlParagraphElement",
    "HtmlParamElement",
    "HtmlPictureElement",
    "HtmlPreElement",
    "HtmlProgressElement",
    "HtmlQuoteElement",
    "HtmlScriptElement",
    "HtmlSelectElement",
    "HtmlSlotElement",
    "HtmlSourceElement",
    "HtmlSpanElement",
    "HtmlStyleElement",
    "HtmlTableCaptionElement",
    "HtmlTableCellElement",
    "HtmlTableColElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableSectionElement",
    "HtmlTemplateElement",
    "HtmlTextAreaElement",
    "HtmlTimeElement",
    "HtmlTitleElement",
    "HtmlTrackElement",
    "HtmlUListElement",
    "HtmlVideoElement",
    "Node",
    "Text",
    "Touch",
    "TouchList",
]

[features]
macros_not_expanded = []
components = []
csr = ["frender-dom/csr", "frender-form-control/csr"]
ssr = ["dep:frender-ssr", "frender-dom/ssr", "frender-form-control/ssr"]
web = [
    "frender-style/web",
    "frender-dom/web",
    "frender-form-control/web",
    "dep:gloo-events",
    "dep:js-sys",
    "dep:web-sys",
    "dep:wasm-bindgen",
]
# impl CsrElement for either::Either
# Also requires csr
either = [
    "dep:either",
    "frender-ssr/either",
    "frender-dom/either",
    "frender-form-control/either",
]
ElementProxyAttrs = ["dep:ref-cast"]
# Enables frender-form-control/chrono
# Also requires ssr or csr
chrono = ["frender-form-control/chrono"]
# Also requires csr
experimental = []
