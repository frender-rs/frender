[package]
name = "frender-ssr"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pin-project-lite = "0.2.9"
either = { version = "1.8.1", default-features = false, optional = true }
frender-common = { version = "0.1.0", path = "../frender-common" }
frender-ssr-html = { version = "0.1.0", path = "../frender-ssr-html" }
async-str-iter = { version = "0.1.0", path = "../async-str-iter" }
frender-reactive-value = { version = "0.1.0", path = "../frender-reactive-value" }

[features]
either = ["dep:either", "frender-ssr-html/either"]
