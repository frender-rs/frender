[package]
name = "frender-events"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
frender-macro-rules = { version = "0.1.0", path = "../frender-macro-rules" }
wasm-bindgen = { version = "0.2.84", optional = true }

[dependencies.web-sys]
version = "0.3.61"
optional = true
features = [
    "Touch",
    "TouchList",
    # "ClipboardEvent",
    "AnimationEvent",
    "ClipboardEvent",
    "CompositionEvent",
    "DragEvent",
    "EventTarget",
    "FocusEvent",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "SecurityPolicyViolationEvent",
    "TouchEvent",
    "TransitionEvent",
    "UiEvent",
    "WheelEvent",
    "HtmlSelectElement",
]

[features]
web = ["dep:web-sys", "dep:wasm-bindgen"]
