[package]
name = "const-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.const-core]
path = ".."

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "slice_sort"
path = "fuzz_targets/slice_sort.rs"
test = false
doc = false
bench = false
